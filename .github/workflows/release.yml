name: build-static

on:
  push:
    paths:
      - "Dockerfile"
      - ".github/workflows/release.yml"
    branches:
      - main
  pull_request:
    paths:
      - "Dockerfile"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build distribution directory
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          target: local
          outputs: type=local,dest=./dist
          cache-from: type=gha,scope=buildah-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=buildah-${{ matrix.arch }}

      - name: Package release tarball
        run: |
          tar -C ./dist -czvf buildah-linux-${{ matrix.arch }}.tar.gz buildah-linux-${{ matrix.arch }}

      - name: Verify static binary & distribution layout
        run: |
          BIN="./dist/buildah-linux-${{ matrix.arch }}/usr/local/bin/buildah"
          file "$BIN"
          if ldd "$BIN" 2>&1 | grep -qv "not a dynamic executable\|statically linked"; then
            echo "Binary is not statically linked!" && exit 1
          fi

      - name: Install podman-static ecosystem & run BATS tests
        run: |
          # Enable unprivileged user namespaces and set SUID bit on shadow UID tools
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo chmod u+s /usr/bin/newuidmap /usr/bin/newgidmap

          # Configure clean subordinate UID/GID mappings
          sudo sed -i "/^${USER}:/d" /etc/subuid /etc/subgid 2>/dev/null || true
          echo "${USER}:100000:65536" | sudo tee -a /etc/subuid > /dev/null
          echo "${USER}:100000:65536" | sudo tee -a /etc/subgid > /dev/null

          # Install test dependencies (BATS and host Go compiler for test fixtures)
          sudo apt-get update && sudo apt-get install -y --no-install-recommends bats uidmap golang-go

          # Fetch and extract matching podman-static release
          ARCH="${{ matrix.arch }}"
          curl -fsSL "https://github.com/mgoltzsche/podman-static/releases/latest/download/podman-linux-${ARCH}.tar.gz" -o podman-static.tar.gz
          sudo tar -xzf podman-static.tar.gz -C /usr/local --strip-components=1

          # Merge our built static bundle directly into system root
          sudo rsync -aP "$(pwd)/dist/buildah-linux-${ARCH}/" /

          # Verify runtime environment and binary placement
          which buildah
          /usr/local/bin/buildah --version
          which crun
          which netavark || /usr/local/lib/podman/netavark --version

          # Fetch test source and build test helper fixtures
          VERSION=$(grep -Eo 'ARG BUILDAH_VERSION="[^"]+"' Dockerfile | cut -d'"' -f2)
          git clone --depth 1 --branch "v${VERSION}" https://github.com/containers/buildah.git /tmp/buildah-src

          cd /tmp/buildah-src
          mkdir -p bin
          go build -o bin/copy ./tests/copy
          go build -o bin/imgtype ./tests/imgtype
          go build -o bin/dumpspec ./tests/dumpspec

          # Execute BATS test suite
          export STORAGE_DRIVER="vfs"
          export BUILDAH_BINARY="/usr/local/bin/buildah"

          cd /tmp/buildah-src/tests
          bats basic.bats
          bats from.bats
          bats config.bats
          bats commit.bats
          bats bud.bats

      - name: Store artifact
        uses: actions/upload-artifact@v4
        with:
          name: buildah-linux-${{ matrix.arch }}.tar.gz
          path: buildah-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    if: github.event_name != 'pull_request'
    needs:
      - build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Extract Buildah version
        id: get_version
        run: |
          VERSION=$(grep -Eo 'ARG BUILDAH_VERSION="[^"]+"' Dockerfile | cut -d'"' -f2)
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -Eo "ARG BUILDAH_VERSION='[^']+'" Dockerfile | cut -d"'" -f2)
          fi
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -Eo 'ARG BUILDAH_VERSION=[^ ]+' Dockerfile | cut -d'=' -f2 | tr -d '"'"'")
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate SHA256 checksums
        run: |
          cd release-artifacts
          sha256sum buildah-linux-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          name: "Buildah v${{ steps.get_version.outputs.version }}"
          tag: "v${{ steps.get_version.outputs.version }}"
          draft: false
          prerelease: false
          makeLatest: true
          allowUpdates: true
          replacesArtifacts: true
          artifacts: "release-artifacts/buildah-linux-*.tar.gz,release-artifacts/SHA256SUMS"