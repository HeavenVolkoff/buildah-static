name: build-static

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for relevant file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - 'Dockerfile'
              - '.github/workflows/release.yml'

      - name: Evaluate execution condition
        id: check
        run: |
          RUN_BUILD="${{ github.event_name != 'pull_request' || steps.filter.outputs.src == 'true' }}"
          echo "run=${RUN_BUILD}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.check.outputs.run == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build distribution directory
        if: steps.check.outputs.run == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          target: local
          outputs: type=local,dest=./dist
          cache-from: type=gha,scope=buildah-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=buildah-${{ matrix.arch }}

      - name: Package release tarball
        if: steps.check.outputs.run == 'true'
        run: |
          tar -C ./dist -czvf buildah-linux-${{ matrix.arch }}.tar.gz buildah-linux-${{ matrix.arch }}

      - name: Verify static binary & distribution layout
        if: steps.check.outputs.run == 'true'
        run: |
          BIN="./dist/buildah-linux-${{ matrix.arch }}/usr/local/bin/buildah"
          file "$BIN"
          if ldd "$BIN" 2>&1 | grep -qv "not a dynamic executable\|statically linked"; then
            echo "Binary is not statically linked!" && exit 1
          fi

      - name: Install upstream container runtime stack & run buildah tests
        if: steps.check.outputs.run == 'true'
        run: |
          echo "Configure system to run buildah tests"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w fs.file-max=2097152
          sudo chmod u+s /usr/bin/newuidmap /usr/bin/newgidmap 2>/dev/null || true
          ulimit -u 65535 2>/dev/null || ulimit -u unlimited 2>/dev/null || true
          ulimit -n 65535 2>/dev/null || true

          echo "Configure clean subordinate UID/GID mappings"
          sudo sed -i "/^${USER}:/d" /etc/subuid /etc/subgid 2>/dev/null || true
          echo "${USER}:100000:65536" | sudo tee -a /etc/subuid > /dev/null
          echo "${USER}:100000:65536" | sudo tee -a /etc/subgid > /dev/null

          echo "Install test dependencies"
          sudo apt-get update && sudo apt-get install -y --no-install-recommends bats uidmap conmon jq

          ARCH="${{ matrix.arch }}"

          # Create all required helper and config target directories
          sudo mkdir -p /usr/libexec/podman /usr/lib/podman /usr/local/lib/podman /usr/local/libexec/podman /etc/containers

          echo "Fetch latest upstream crun release"
          sudo curl -fsSL "$(
            curl -sL https://api.github.com/repos/containers/crun/releases/latest | jq -r ".assets[] | select(.name | test(\"^crun-.*-linux-${ARCH}$\")) | .browser_download_url"
          )" -o /usr/local/bin/crun
          sudo chmod +x /usr/local/bin/crun
          sudo ln -sf /usr/local/bin/crun /usr/bin/crun

          echo "Fetch latest upstream Netavark and Aardvark-dns"
          curl -fsSL "https://github.com/containers/netavark/releases/latest/download/netavark.gz" -o /tmp/netavark.gz
          gzip -dc /tmp/netavark.gz | sudo tee /usr/libexec/podman/netavark > /dev/null
          sudo chmod +x /usr/libexec/podman/netavark
          sudo ln -sf /usr/libexec/podman/netavark /usr/lib/podman/netavark
          sudo ln -sf /usr/libexec/podman/netavark /usr/local/lib/podman/netavark
          sudo ln -sf /usr/libexec/podman/netavark /usr/local/libexec/podman/netavark

          curl -fsSL "https://github.com/containers/aardvark-dns/releases/latest/download/aardvark-dns.gz" -o /tmp/aardvark-dns.gz
          gzip -dc /tmp/aardvark-dns.gz | sudo tee /usr/libexec/podman/aardvark-dns > /dev/null
          sudo chmod +x /usr/libexec/podman/aardvark-dns
          sudo ln -sf /usr/libexec/podman/aardvark-dns /usr/lib/podman/aardvark-dns
          sudo ln -sf /usr/libexec/podman/aardvark-dns /usr/local/lib/podman/aardvark-dns
          sudo ln -sf /usr/libexec/podman/aardvark-dns /usr/local/libexec/podman/aardvark-dns

          echo "Create base container configuration files"
          echo '{"default":[{"type":"insecureAcceptAnything"}]}' | sudo tee /etc/containers/policy.json > /dev/null
          echo 'unqualified-search-registries = ["docker.io", "quay.io"]' | sudo tee /etc/containers/registries.conf > /dev/null

          echo "Merge our built static bundle directly into system root"
          sudo rsync -aP "$(pwd)/dist/buildah-linux-${ARCH}/" /

          echo "Verify runtime environment and binary placement"
          /usr/local/bin/buildah --version
          /usr/bin/crun --version
          /usr/libexec/podman/netavark --version
          /usr/libexec/podman/aardvark-dns --version

          echo "Fetch test source and compile helper fixtures in pure Go"
          VERSION=$(grep -Eo 'ARG BUILDAH_VERSION="[^"]+"' Dockerfile | cut -d'"' -f2)
          git clone --depth 1 --branch "v${VERSION}" https://github.com/containers/buildah.git /tmp/buildah-src

          cd /tmp/buildah-src
          mkdir -p bin
          export BUILDTAGS="containers_image_openpgp exclude_graphdriver_btrfs exclude_graphdriver_devicemapper"
          CGO_ENABLED=0 go build -tags "$BUILDTAGS" -o bin/copy ./tests/copy
          CGO_ENABLED=0 go build -tags "$BUILDTAGS" -o bin/imgtype ./tests/imgtype
          CGO_ENABLED=0 go build -tags "$BUILDTAGS" -o bin/dumpspec ./tests/dumpspec

          echo "Execute BATS test suite"
          cd /tmp/buildah-src/tests
          sudo -E env \
            "PATH=${PATH}" \
            "STORAGE_DRIVER=overlay" \
            "BUILDAH_BINARY=/usr/local/bin/buildah" \
            bats -T basic.bats \
            from.bats \
            config.bats \
            commit.bats \
            bud.bats

      - name: Store artifact
        if: steps.check.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: buildah-linux-${{ matrix.arch }}.tar.gz
          path: buildah-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

      - name: Skip notice
        if: steps.check.outputs.run != 'true'
        run: echo "No build-related files modified. Build & test steps skipped."

  release:
    if: github.event_name != 'pull_request'
    needs:
      - build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Extract Buildah version
        id: get_version
        run: |
          VERSION=$(grep -Eo 'ARG BUILDAH_VERSION="[^"]+"' Dockerfile | cut -d'"' -f2)
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -Eo "ARG BUILDAH_VERSION='[^']+'" Dockerfile | cut -d"'" -f2)
          fi
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -Eo 'ARG BUILDAH_VERSION=[^ ]+' Dockerfile | cut -d'=' -f2 | tr -d '"'"'")
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate SHA256 checksums
        run: |
          cd release-artifacts
          sha256sum buildah-linux-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          name: "Buildah v${{ steps.get_version.outputs.version }}"
          tag: "v${{ steps.get_version.outputs.version }}"
          draft: false
          prerelease: false
          makeLatest: true
          allowUpdates: true
          replacesArtifacts: true
          artifacts: "release-artifacts/buildah-linux-*.tar.gz,release-artifacts/SHA256SUMS"