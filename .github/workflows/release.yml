name: build-static

on:
  push:
    paths:
      - "Dockerfile"
      - ".github/workflows/release.yml"
    branches:
      - main
  pull_request:
    paths:
      - "Dockerfile"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build distribution directory
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          target: local
          outputs: type=local,dest=./dist
          cache-from: type=gha,scope=buildah-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=buildah-${{ matrix.arch }}

      - name: Package release tarball
        run: |
          tar -C ./dist -czvf buildah-linux-${{ matrix.arch }}.tar.gz buildah-linux-${{ matrix.arch }}

      - name: Verify static binary & distribution layout
        run: |
          BIN="./dist/buildah-linux-${{ matrix.arch }}/usr/local/bin/buildah"
          file "$BIN"
          if ldd "$BIN" 2>&1 | grep -qv "not a dynamic executable\|statically linked"; then
            echo "Binary is not statically linked!" && exit 1
          fi

      - name: Install latest Netavark
        run: |
          sudo mkdir -p /usr/local/libexec/podman /usr/local/lib/podman
          # Fetch matching release of netavark for the target architecture
          ARCH="${{ matrix.arch }}"
          curl -fsSL "https://github.com/containers/netavark/releases/latest/download/netavark.gz" -o netavark.gz || \
          curl -fsSL "https://github.com/containers/netavark/releases/download/v1.14.0/netavark-linux-${ARCH}.gz" -o netavark.gz
          gzip -d netavark.gz
          chmod +x netavark
          sudo mv netavark /usr/local/libexec/podman/netavark
          sudo ln -sf /usr/local/libexec/podman/netavark /usr/libexec/podman/netavark
          sudo ln -sf /usr/local/libexec/podman/netavark /usr/lib/podman/netavark

      - name: Run official Buildah BATS test suite
        run: |
          # 1. Disable Ubuntu 24.04 AppArmor unprivileged userns restriction
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

          # 2. Configure subordinate UID/GID ranges for the runner user
          sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 "$USER" || true
          echo "$USER:100000:65536" | sudo tee -a /etc/subuid /etc/subgid > /dev/null

          # 3. Install test prerequisites
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            bats \
            crun \
            uidmap

          # 4. Expose static binary to PATH and set test environment
          STATIC_BIN_DIR="$(pwd)/dist/buildah-linux-${{ matrix.arch }}/usr/local/bin"
          export PATH="${STATIC_BIN_DIR}:${PATH}"
          export BUILDAH_BINARY="${STATIC_BIN_DIR}/buildah"
          export STORAGE_DRIVER="vfs"

          # 5. Clone matching release source for test files
          VERSION=$(grep -Eo 'ARG BUILDAH_VERSION="[^"]+"' Dockerfile | cut -d'"' -f2)
          git clone --depth 1 --branch "v${VERSION}" https://github.com/containers/buildah.git /tmp/buildah-src

          # 6. Execute core test suites
          cd /tmp/buildah-src/tests
          bats basic.bats
          bats from.bats
          bats config.bats
          bats commit.bats
          bats bud.bats

      - name: Store artifact
        uses: actions/upload-artifact@v4
        with:
          name: buildah-linux-${{ matrix.arch }}.tar.gz
          path: buildah-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    if: github.event_name != 'pull_request'
    needs:
      - build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Extract Buildah version
        id: get_version
        run: |
          VERSION=$(grep -Eo 'ARG BUILDAH_VERSION="[^"]+"' Dockerfile | cut -d'"' -f2)
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -Eo "ARG BUILDAH_VERSION='[^']+'" Dockerfile | cut -d"'" -f2)
          fi
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -Eo 'ARG BUILDAH_VERSION=[^ ]+' Dockerfile | cut -d'=' -f2 | tr -d '"'"'")
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate SHA256 checksums
        run: |
          cd release-artifacts
          sha256sum buildah-linux-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          name: "Buildah v${{ steps.get_version.outputs.version }}"
          tag: "v${{ steps.get_version.outputs.version }}"
          draft: false
          prerelease: false
          makeLatest: true
          allowUpdates: true
          replacesArtifacts: true
          artifacts: "release-artifacts/buildah-linux-*.tar.gz,release-artifacts/SHA256SUMS"