name: build-static

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for relevant file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - 'Dockerfile'
              - '.github/workflows/release.yml'

      - name: Evaluate execution condition
        id: check
        run: |
          RUN_BUILD="${{ github.event_name != 'pull_request' || steps.filter.outputs.src == 'true' }}"
          echo "run=${RUN_BUILD}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.check.outputs.run == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build distribution directory
        if: steps.check.outputs.run == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          target: local
          outputs: type=local,dest=./dist
          cache-from: type=gha,scope=buildah-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=buildah-${{ matrix.arch }}

      - name: Package release tarball
        if: steps.check.outputs.run == 'true'
        run: |
          tar -C ./dist -czvf buildah-linux-${{ matrix.arch }}.tar.gz buildah-linux-${{ matrix.arch }}

      - name: Verify static binary
        if: steps.check.outputs.run == 'true'
        run: |
          BIN="./dist/buildah-linux-${{ matrix.arch }}/usr/local/bin/buildah"
          file "$BIN"
          if ldd "$BIN" 2>&1 | grep -qv "not a dynamic executable\|statically linked"; then
            echo "Binary is not statically linked!" && exit 1
          fi

      - name: Install podman-static & run buildah test suite
        if: steps.check.outputs.run == 'true'
        run: |
          echo "Configure system kernel and subordinate mappings"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w fs.file-max=2097152
          sudo chmod u+s /usr/bin/newuidmap /usr/bin/newgidmap 2>/dev/null || true
          ulimit -u 65535 2>/dev/null || ulimit -u unlimited 2>/dev/null || true
          ulimit -n 65535 2>/dev/null || true

          for which in uid gid; do
            sudo sed -i "/^${USER}:/d" /etc/sub$which 2>/dev/null || true
            echo "${USER}:100000:65536" | sudo tee -a /etc/sub$which > /dev/null
          done

          echo "Fetch latest upstream podman-static release"
          ARCH="${{ matrix.arch }}"
          DOWNLOAD_URL=$(curl -sL https://api.github.com/repos/mgoltzsche/podman-static/releases/latest | jq -r ".assets[] | select(.name == \"podman-linux-${ARCH}.tar.gz\") | .browser_download_url")
          curl -fsSL "$DOWNLOAD_URL" -o /tmp/podman-static.tar.gz
          sudo tar -xzf /tmp/podman-static.tar.gz -C /tmp
          sudo rsync -aP /tmp/podman-linux-${ARCH}/ /

          echo "Link helper binaries across standard search paths"
          sudo mkdir -p /usr/libexec/podman /usr/local/bin
          for helper in /usr/local/lib/podman/*; do
            [ -f "$helper" ] || continue
            sudo ln -sf "$helper" "/usr/libexec/podman/$(basename "$helper")"
            sudo ln -sf "$helper" "/usr/local/bin/$(basename "$helper")"
          done

          echo "Install built static Buildah"
          sudo rsync -aP "$(pwd)/dist/buildah-linux-${ARCH}/" /

          echo "Verify runtime environment"
          crun --version
          netavark --version
          aardvark-dns --version

          sudo_buildah() {
            sudo env PATH="${PATH}" CI=true GIT_TERMINAL_PROMPT=0 NETAVARK_FW=nftables STORAGE_DRIVER=overlay /usr/local/bin/buildah "$@"
          }

          echo "============================================================"
          echo "TEST 1: Binary info, storage driver & version verification"
          echo "============================================================"
          sudo_buildah --version
          sudo_buildah info

          echo "============================================================"
          echo "TEST 2: Remote registry pull, inspect & local storage commit"
          echo "============================================================"
          sudo_buildah pull alpine:latest
          sudo_buildah inspect --type image alpine:latest | jq -e '.OCIv1.architecture' > /dev/null

          echo "============================================================"
          echo "TEST 3: Direct container mount, filesystem mutation & commit"
          echo "============================================================"
          CTR=$(sudo_buildah from scratch)
          MNT=$(sudo_buildah mount "$CTR")
          echo "hello from static buildah" | sudo tee "$MNT/static-test.txt" > /dev/null
          sudo_buildah unmount "$CTR"
          sudo_buildah commit "$CTR" localhost/scratch-test:latest
          sudo_buildah rm "$CTR"

          echo "============================================================"
          echo "TEST 4: crun execution, namespaces & container standard I/O"
          echo "============================================================"
          ALPINE_CTR=$(sudo_buildah from alpine:latest)
          OUTPUT=$(sudo_buildah run "$ALPINE_CTR" -- /bin/sh -c "echo 'CRUN_OK' && uname -m")
          echo "$OUTPUT" | grep -q "CRUN_OK"
          sudo_buildah rm "$ALPINE_CTR"

          echo "============================================================"
          echo "TEST 5: Multi-stage Dockerfile build (bud), network & caching"
          echo "============================================================"
          TEST_DIR=$(mktemp -d)
          cat << 'EOF' > "$TEST_DIR/Containerfile"
          FROM alpine:latest AS builder
          RUN echo "stage-1" > /build.txt
          RUN wget -q --spider https://quay.io || true

          FROM alpine:latest
          COPY --from=builder /build.txt /stage-result.txt
          ENV TEST_VAR="buildah_static_verified"
          WORKDIR /app
          RUN echo "final-stage" > app.txt
          CMD ["cat", "/stage-result.txt"]
          EOF

          sudo_buildah bud \
            --layers \
            --tag localhost/bud-smoke-test:latest \
            "$TEST_DIR"
          rm -rf "$TEST_DIR"

          echo "============================================================"
          echo "TEST 6: Validating generated artifact execution & metadata"
          echo "============================================================"
          BUD_CTR=$(sudo_buildah from localhost/bud-smoke-test:latest)
          RESULT=$(sudo_buildah run "$BUD_CTR" -- cat /stage-result.txt)
          [ "$RESULT" = "stage-1" ]
          sudo_buildah rm "$BUD_CTR"

          echo "============================================================"
          echo "TEST 7: Archive export and round-trip re-import"
          echo "============================================================"
          ARCHIVE_PATH="/tmp/test-image.tar"
          sudo_buildah push localhost/bud-smoke-test:latest "docker-archive:${ARCHIVE_PATH}"
          sudo_buildah rmi localhost/bud-smoke-test:latest
          sudo_buildah pull "docker-archive:${ARCHIVE_PATH}"
          sudo_buildah images | grep -q "bud-smoke-test"
          rm -f "${ARCHIVE_PATH}"

          echo "============================================================"
          echo "ALL STATIC BUILDAH VALIDATION CHECKS PASSED SUCCESSFULLY!"
          echo "============================================================"
      - name: Store artifact
        if: steps.check.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: buildah-linux-${{ matrix.arch }}.tar.gz
          path: buildah-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

      - name: Skip notice
        if: steps.check.outputs.run != 'true'
        run: echo "No build-related files modified. Build & test steps skipped."

  release:
    timeout-minutes: 10
    if: github.event_name != 'pull_request'
    needs:
      - build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Extract Buildah version
        id: get_version
        run: |
          VERSION=$(grep -Eo 'ARG BUILDAH_VERSION="[^"]+"' Dockerfile | cut -d'"' -f2)
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -Eo "ARG BUILDAH_VERSION='[^']+'" Dockerfile | cut -d"'" -f2)
          fi
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -Eo 'ARG BUILDAH_VERSION=[^ ]+' Dockerfile | cut -d'=' -f2 | tr -d '"'"'")
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate SHA256 checksums
        run: |
          cd release-artifacts
          sha256sum buildah-linux-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          name: "Buildah v${{ steps.get_version.outputs.version }}"
          tag: "v${{ steps.get_version.outputs.version }}"
          draft: false
          prerelease: false
          makeLatest: true
          allowUpdates: true
          replacesArtifacts: true
          artifacts: "release-artifacts/buildah-linux-*.tar.gz,release-artifacts/SHA256SUMS"